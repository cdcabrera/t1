name: PR PreCheck
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Validate PR
        uses: actions/github-script@v9
        with:
          script: |
            const preCheck = await import(`${process.env.GITHUB_WORKSPACE}/scripts/workflow.preCheck.js`);

            await preCheck.start({
              isFreezeActive: '${{ vars.RELEASE_FREEZE_ACTIVE }}' === 'true',
              LABEL_CODE_FREEZE: 'bot:code-freeze',
              LABEL_BREAKING_POTENTIAL: 'bot:breaking-potential',
              LABEL_NEEDS_CLEANUP: 'bot:needs-cleanup',
              LABEL_NEEDS_MAINTAINER: 'bot:needs-maintainer',
              LABEL_CONFIRMED: 'bot:contributor-confirmed',
              LABEL_UNCONFIRMED: 'bot:contributor-unconfirmed',
              LABEL_PRECHECKS_PASS: 'bot:ready-for-testing',
              LABEL_PRECHECKS_BYPASS: 'bot:maintainer-bypass',
              LABEL_SEC: 'bot:needs-sec'
            }, {
              github,
              context,
              core,
            });

  Commits:
    if: |
      contains(github.event.pull_request.labels.*.name, 'bot:ready-for-testing') ||
      contains(github.event.pull_request.labels.*.name, 'bot:maintainer-bypass')
    needs: gatekeeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Git commits
        run: |
          git remote add ssh-origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch ssh-origin
          echo 'GIT_COMMITS<<EOF' >> $GITHUB_ENV
          git cherry -v ssh-origin/${{ process.env.BRANCH }} | grep "+" >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Lint
        uses: actions/github-script@v9
        with:
          script: |
            const workflowCommitLint = await import(`${ process.env.GITHUB_WORKSPACE }/scripts/workflow.commitLint.js`);

            const { resultsArray, resultsString } = workflowCommitLint(process.env.GIT_COMMITS)

            if (resultsArray.length) {
              core.setFailed(resultsString)
            }
